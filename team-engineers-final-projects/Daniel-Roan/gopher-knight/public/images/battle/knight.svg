<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Background -->
  <rect width="64" height="64" fill="transparent"/>
  
  <!-- Knight Body (Armor) -->
  <rect x="24" y="28" width="16" height="20" fill="#8B9DC3" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Knight Head (Helmet) -->
  <rect x="22" y="14" width="20" height="18" rx="2" fill="#A0AEC0" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Helmet Visor -->
  <rect x="26" y="20" width="12" height="4" fill="#2D3748"/>
  
  <!-- Helmet Plume -->
  <rect x="30" y="8" width="4" height="8" fill="#E53E3E"/>
  <rect x="28" y="6" width="8" height="4" rx="1" fill="#E53E3E"/>
  
  <!-- Left Arm -->
  <rect x="14" y="30" width="8" height="14" rx="2" fill="#A0AEC0" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Right Arm -->
  <rect x="42" y="30" width="8" height="14" rx="2" fill="#A0AEC0" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Sword Handle -->
  <rect x="50" y="38" width="4" height="8" fill="#744210"/>
  
  <!-- Sword Guard -->
  <rect x="46" y="36" width="12" height="3" fill="#F6E05E"/>
  
  <!-- Sword Blade -->
  <rect x="49" y="14" width="6" height="24" fill="#E2E8F0"/>
  <rect x="50" y="12" width="4" height="3" fill="#E2E8F0"/>
  
  <!-- Shield -->
  <rect x="8" y="32" width="10" height="14" rx="1" fill="#3182CE" stroke="#2C5282" stroke-width="2"/>
  <rect x="11" y="35" width="4" height="8" fill="#F6E05E"/>
  
  <!-- Legs -->
  <rect x="24" y="46" width="6" height="14" fill="#4A5568"/>
  <rect x="34" y="46" width="6" height="14" fill="#4A5568"/>
  
  <!-- Feet -->
  <rect x="22" y="58" width="10" height="4" rx="1" fill="#2D3748"/>
  <rect x="32" y="58" width="10" height="4" rx="1" fill="#2D3748"/>
</svg>
