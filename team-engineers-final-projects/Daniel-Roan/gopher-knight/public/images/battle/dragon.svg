<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Background -->
  <rect width="64" height="64" fill="transparent"/>
  
  <!-- Dragon Body -->
  <ellipse cx="32" cy="40" rx="18" ry="14" fill="#E53E3E" stroke="#9B2C2C" stroke-width="2"/>
  
  <!-- Dragon Belly -->
  <ellipse cx="32" cy="42" rx="12" ry="9" fill="#FC8181"/>
  
  <!-- Dragon Head -->
  <rect x="42" y="20" width="16" height="16" rx="4" fill="#E53E3E" stroke="#9B2C2C" stroke-width="2"/>
  
  <!-- Dragon Snout -->
  <rect x="56" y="26" width="6" height="8" rx="2" fill="#C53030"/>
  
  <!-- Dragon Eye -->
  <rect x="48" y="24" width="4" height="4" fill="#F6E05E"/>
  <rect x="49" y="25" width="2" height="2" fill="#000"/>
  
  <!-- Dragon Horn -->
  <rect x="46" y="14" width="4" height="8" fill="#4A5568"/>
  <rect x="52" y="16" width="4" height="6" fill="#4A5568"/>
  
  <!-- Dragon Wing Left -->
  <path d="M18 30 L6 14 L22 22 Z" fill="#C53030" stroke="#9B2C2C" stroke-width="2"/>
  <path d="M18 30 L10 20 L20 26 Z" fill="#9B2C2C"/>
  
  <!-- Dragon Wing Right -->
  <path d="M46 30 L58 14 L42 22 Z" fill="#C53030" stroke="#9B2C2C" stroke-width="2"/>
  <path d="M46 30 L54 20 L44 26 Z" fill="#9B2C2C"/>
  
  <!-- Dragon Tail -->
  <rect x="12" y="38" width="10" height="4" rx="1" fill="#E53E3E"/>
  <rect x="6" y="36" width="8" height="4" rx="1" fill="#C53030"/>
  <rect x="2" y="34" width="6" height="4" rx="1" fill="#9B2C2C"/>
  
  <!-- Dragon Legs -->
  <rect x="22" y="52" width="5" height="8" fill="#C53030"/>
  <rect x="37" y="52" width="5" height="8" fill="#C53030"/>
  
  <!-- Dragon Claws -->
  <rect x="21" y="58" width="2" height="3" fill="#4A5568"/>
  <rect x="24" y="58" width="2" height="3" fill="#4A5568"/>
  <rect x="36" y="58" width="2" height="3" fill="#4A5568"/>
  <rect x="39" y="58" width="2" height="3" fill="#4A5568"/>
  
  <!-- Fire Breath (when attacking) - shown as separate element -->
  <g id="fire-breath" opacity="0">
    <rect x="60" y="26" width="8" height="4" fill="#F6AD55"/>
    <rect x="64" y="22" width="6" height="4" fill="#F6E05E"/>
    <rect x="64" y="30" width="6" height="4" fill="#C05621"/>
  </g>
</svg>
