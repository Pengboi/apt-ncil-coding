<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Drone/Ninja Idle Stance -->
  
  <!-- Legs -->
  <rect x="5" y="14" width="3" height="6" fill="#0f0f1a"/>
  <rect x="11" y="14" width="3" height="6" fill="#0f0f1a"/>
  
  <!-- Body (robe) -->
  <rect x="4" y="6" width="12" height="10" fill="#1a1a2e"/>
  <rect x="8" y="12" width="4" height="4" fill="#0f0f1a"/>
  
  <!-- Belt -->
  <rect x="4" y="10" width="12" height="1" fill="#4a2800"/>
  
  <!-- Robe accents -->
  <rect x="4" y="6" width="12" height="1" fill="#e67e22"/>
  <rect x="4" y="15" width="12" height="1" fill="#e67e22"/>
  
  <!-- Head (hood) -->
  <rect x="5" y="0" width="10" height="8" fill="#1a1a2e"/>
  
  <!-- Face mask -->
  <rect x="6" y="4" width="8" height="3" fill="#0a0a14"/>
  
  <!-- Eyes (glowing) -->
  <rect x="6" y="4" width="2" height="1" fill="#e74c3c"/>
  <rect x="12" y="4" width="2" height="1" fill="#e74c3c"/>
  
  <!-- Headband -->
  <rect x="3" y="1" width="14" height="1" fill="#e74c3c"/>
  
  <!-- Headband tail -->
  <rect x="15" y="1" width="4" height="1" fill="#e74c3c"/>
  <rect x="16" y="2" width="3" height="1" fill="#e74c3c"/>
  
  <!-- Arms (at sides) -->
  <rect x="2" y="8" width="3" height="5" fill="#1a1a2e"/>
  <rect x="2" y="11" width="3" height="1" fill="#c4956a"/>
  <rect x="15" y="8" width="3" height="4" fill="#1a1a2e"/>
  <rect x="15" y="10" width="2" height="2" fill="#c4956a"/>
  
  <!-- Katana on back -->
  <rect x="2" y="0" width="1" height="10" fill="#c0c0c0"/>
  <rect x="1" y="0" width="3" height="1" fill="#8b4513"/>
</svg>