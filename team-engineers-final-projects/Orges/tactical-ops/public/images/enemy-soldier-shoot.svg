<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Soldier Shooting Stance -->
  
  <!-- Back leg (planted) -->
  <rect x="4" y="34" width="8" height="14" fill="#2a3a5d"/>
  <rect x="2" y="44" width="12" height="4" fill="#1a1a2e"/>
  <rect x="2" y="43" width="12" height="1" fill="#2a2a3e"/>
  
  <!-- Front leg (wide stance) -->
  <rect x="20" y="32" width="8" height="16" fill="#2a3a5d"/>
  <rect x="18" y="44" width="12" height="4" fill="#1a1a2e"/>
  <rect x="18" y="43" width="12" height="1" fill="#2a2a3e"/>
  
  <!-- Body -->
  <rect x="6" y="16" width="22" height="18" fill="#1e3a5f"/>
  <rect x="8" y="18" width="18" height="14" fill="#2c4a6e"/>
  
  <!-- Vest -->
  <rect x="10" y="20" width="5" height="8" fill="#1a2a4d"/>
  <rect x="19" y="20" width="5" height="8" fill="#1a2a4d"/>
  
  <!-- Back arm (stock) -->
  <rect x="4" y="18" width="6" height="10" fill="#1e3a5f"/>
  <rect x="2" y="24" width="6" height="6" fill="#1a1a2e"/>
  
  <!-- Front arm (foregrip) -->
  <rect x="22" y="20" width="10" height="5" fill="#1e3a5f"/>
  <rect x="30" y="19" width="6" height="6" fill="#1a1a2e"/>
  
  <!-- Head -->
  <rect x="10" y="4" width="14" height="14" fill="#c4956a"/>
  
  <!-- Helmet -->
  <rect x="8" y="2" width="18" height="10" fill="#152a3f"/>
  <rect x="8" y="10" width="18" height="3" fill="#1e3a5f"/>
  <rect x="7" y="10" width="20" height="1" fill="#0f1a2f"/>
  
  <!-- Visor -->
  <rect x="12" y="8" width="10" height="4" fill="#1a1a1a"/>
  <rect x="13" y="9" width="3" height="2" fill="#e67e22"/>
  <rect x="18" y="9" width="3" height="2" fill="#e67e22"/>
  <rect x="14" y="9" width="1" height="1" fill="#f39c12"/>
  <rect x="19" y="9" width="1" height="1" fill="#f39c12"/>
  
  <!-- Rifle (extended) -->
  <rect x="6" y="20" width="4" height="5" fill="#b08555"/>
  <rect x="26" y="18" width="20" height="5" fill="#c4956a"/>
  <rect x="44" y="19" width="6" height="3" fill="#b08555"/>
  <rect x="32" y="23" width="4" height="6" fill="#8b6f4e"/>
  <rect x="34" y="16" width="6" height="2" fill="#2a2a2a"/>
  
  <!-- Muzzle flash -->
  <rect x="50" y="17" width="4" height="7" fill="#f39c12"/>
  <rect x="52" y="16" width="3" height="9" fill="#f1c40f"/>
  <rect x="54" y="18" width="2" height="5" fill="#fff"/>
  
  <!-- Sparks -->
  <rect x="55" y="15" width="1" height="2" fill="#f1c40f"/>
  <rect x="56" y="20" width="1" height="1" fill="#f39c12"/>
  <rect x="55" y="24" width="1" height="2" fill="#f1c40f"/>
  
  <!-- Shell casing -->
  <rect x="12" y="14" width="2" height="3" fill="#f1c40f"/>
</svg>