<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Drone/Ninja Walking (Darting Run) -->
  
  <!-- Back leg (extended) -->
  <rect x="2" y="14" width="4" height="6" fill="#0f0f1a"/>
  <rect x="1" y="18" width="4" height="2" fill="#0f0f1a"/>
  
  <!-- Front leg (forward) -->
  <rect x="12" y="12" width="4" height="6" fill="#0f0f1a"/>
  <rect x="11" y="18" width="4" height="2" fill="#0f0f1a"/>
  
  <!-- Body (robe, leaning) -->
  <rect x="4" y="5" width="12" height="9" fill="#1a1a2e"/>
  <rect x="8" y="11" width="4" height="3" fill="#0f0f1a"/>
  
  <!-- Belt -->
  <rect x="4" y="9" width="12" height="1" fill="#4a2800"/>
  
  <!-- Accents -->
  <rect x="4" y="5" width="12" height="1" fill="#e67e22"/>
  <rect x="4" y="13" width="12" height="1" fill="#e67e22"/>
  
  <!-- Head (hood) -->
  <rect x="5" y="0" width="10" height="7" fill="#1a1a2e"/>
  
  <!-- Face mask -->
  <rect x="6" y="3" width="8" height="3" fill="#0a0a14"/>
  
  <!-- Eyes -->
  <rect x="6" y="3" width="2" height="1" fill="#e74c3c"/>
  <rect x="12" y="3" width="2" height="1" fill="#e74c3c"/>
  
  <!-- Headband (fluttering) -->
  <rect x="3" y="1" width="14" height="1" fill="#e74c3c"/>
  <rect x="15" y="0" width="4" height="1" fill="#e74c3c"/>
  <rect x="17" y="1" width="3" height="1" fill="#e74c3c"/>
  
  <!-- Arms -->
  <rect x="2" y="6" width="3" height="5" fill="#1a1a2e"/>
  <rect x="2" y="9" width="3" height="1" fill="#c4956a"/>
  <rect x="15" y="7" width="3" height="4" fill="#1a1a2e"/>
  <rect x="15" y="9" width="2" height="2" fill="#c4956a"/>
  
  <!-- Katana on back -->
  <rect x="2" y="0" width="1" height="8" fill="#c0c0c0"/>
  <rect x="1" y="0" width="3" height="1" fill="#8b4513"/>
</svg>