<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy Shooting (LMG Fire) -->
  
  <!-- Back leg (braced) -->
  <rect x="2" y="34" width="10" height="14" fill="#1a1a2e"/>
  <rect x="0" y="44" width="12" height="4" fill="#0a0a14"/>
  
  <!-- Front leg (wide) -->
  <rect x="22" y="32" width="10" height="16" fill="#1a1a2e"/>
  <rect x="20" y="44" width="12" height="4" fill="#0a0a14"/>
  
  <!-- Body (braced for recoil) -->
  <rect x="4" y="14" width="26" height="22" fill="#2d132c"/>
  <rect x="6" y="16" width="22" height="16" fill="#4a2349"/>
  
  <!-- Armor -->
  <rect x="8" y="18" width="6" height="8" fill="#1a0f19"/>
  <rect x="20" y="18" width="6" height="8" fill="#1a0f19"/>
  
