<svg width="32" height="24" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Drone/Ninja Throwing Star -->
  
  <!-- Legs (braced) -->
  <rect x="6" y="14" width="4" height="6" fill="#0f0f1a"/>
  <rect x="12" y="14" width="4" height="6" fill="#0f0f1a"/>
  
  <!-- Body (robe) -->
  <rect x="4" y="6" width="14" height="10" fill="#1a1a2e"/>
  <rect x="8" y="12" width="4" height="3" fill="#0f0f1a"/>
  
  <!-- Belt -->
  <rect x="4" y="10" width="14" height="1" fill="#4a2800"/>
  
  <!-- Accents -->
  <rect x="4" y="6" width="14" height="1" fill="#e67e22"/>
  <rect x="4" y="15" width="14" height="1" fill="#e67e22"/>
  
  <!-- Head (hood) -->
  <rect x="5" y="0" width="10" height="8" fill="#1a1a2e"/>
  
  <!-- Face mask -->
  <rect x="6" y="4" width="8" height="3" fill="#0a0a14"/>
  
  <!-- Eyes -->
  <rect x="6" y="4" width="2" height="1" fill="#e74c3c"/>
  <rect x="12" y="4" width="2" height="1" fill="#e74c3c"/>
  
  <!-- Headband -->
  <rect x="3" y="1" width="14" height="1" fill="#e74c3c"/>
  <rect x="15" y="1" width="4" height="1" fill="#e74c3c"/>
  
  <!-- Back arm -->
  <rect x="2" y="8" width="3" height="5" fill="#1a1a2e"/>
  <rect x="2" y="11" width="3" height="1" fill="#c4956a"/>
  
  <!-- Throwing arm (extended) -->
  <rect x="17" y="7" width="4" height="4" fill="#1a1a2e"/>
  <rect x="19" y="9" width="2" height="3" fill="#c4956a"/>
  
  <!-- Ninja star (in hand) -->
  <rect x="20" y="7" width="3" height="3" fill="#888"/>
  <rect x="19" y="8" width="2" height="2" fill="#aaa"/>
  <rect x="22" y="8" width="2" height="2" fill="#aaa"/>
  
  <!-- Star trail/motion lines -->
  <rect x="24" y="7" width="4" height="1" fill="#ccc"/>
  <rect x="25" y="8" width="3" height="1" fill="#aaa"/>
  <rect x="24" y="9" width="4" height="1" fill="#ccc"/>
</svg>