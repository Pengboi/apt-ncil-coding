<svg width="256" height="48" viewBox="0 0 256 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Enemy Walk Cycle - 8 Frame Animation Strip (matching Craftpix reference) -->
  
  <!-- FRAME 1: Standing, slight forward lean -->
  <g transform="translate(0,0)">
    <!-- Back leg -->
    <rect x="6" y="34" width="8" height="14" fill="#2a3a5d"/>
    <rect x="5" y="44" width="10" height="4" fill="#1a1a2e"/>
    <!-- Front leg (slightly forward) -->
