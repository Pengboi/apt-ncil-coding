<svg width="32" height="48" viewBox="0 0 32 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Soldier Walking (Tactical Stride) -->
  
  <!-- Back leg (extended) -->
  <rect x="2" y="34" width="8" height="12" fill="#2a3a5d"/>
  <rect x="0" y="44" width="10" height="4" fill="#1a1a2e"/>
  
  <!-- Front leg (forward) -->
  <rect x="18" y="30" width="8" height="16" fill="#2a3a5d"/>
  <rect x="17" y="44" width="10" height="4" fill="#1a1a2e"/>
  
  <!-- Body -->
  <rect x="4" y="16" width="24" height="20" fill="#1e3a5f"/>
  <rect x="6" y="18" width="20" height="14" fill="#2c4a6e"/>
  
  <!-- Vest -->
  <rect x="8" y="20" width="6" height="6" fill="#1a2a4d"/>
  <rect x="18" y="20" width="6" height="6" fill="#1a2a4d"/>
  
  <!-- Arms (swinging) -->
  <rect x="0" y="16" width="6" height="14" fill="#1e3a5f"/>
  <rect x="26" y="20" width="6" height="12" fill="#1e3a5f"/>
  
  <!-- Gloves -->
  <rect x="0" y="28" width="6" height="6" fill="#1a1a2e"/>
  <rect x="26" y="30" width="6" height="6" fill="#1a1a2e"/>
  
  <!-- Head -->
  <rect x="8" y="4" width="16" height="14" fill="#c4956a"/>
  
  <!-- Helmet -->
  <rect x="6" y="2" width="20" height="10" fill="#152a3f"/>
  <rect x="6" y="10" width="20" height="3" fill="#1e3a5f"/>
  <rect x="5" y="10" width="22" height="1" fill="#0f1a2f"/>
  
  <!-- Visor -->
  <rect x="10" y="8" width="12" height="4" fill="#1a1a1a"/>
  <rect x="11" y="9" width="4" height="2" fill="#e67e22"/>
  <rect x="17" y="9" width="4" height="2" fill="#e67e22"/>
  
  <!-- Rifle held low -->
  <rect x="2" y="22" width="28" height="4" fill="#c4956a"/>
  <rect x="4" y="21" width="6" height="3" fill="#b08555"/>
  <rect x="26" y="23" width="4" height="3" fill="#8b6f4e"/>
</svg>