<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Grunt Melee Attack (Knife Swing) -->
  
  <!-- Back leg (planted) -->
  <rect x="4" y="34" width="8" height="14" fill="#1a1a2e"/>
  <rect x="2" y="44" width="12" height="4" fill="#0f0f1a"/>
  
  <!-- Front leg (forward lunge) -->
  <rect x="22" y="30" width="8" height="16" fill="#1a1a2e"/>
  <rect x="20" y="44" width="12" height="4" fill="#0f0f1a"/>
  
  <!-- Body (lunged forward) -->
  <rect x="8" y="14" width="22" height="18" fill="#2c3e50"/>
  <rect x="9" y="16" width="18" height="14" fill="#34495e"/>
  
  <!-- Vest -->
  <rect x="11" y="18" width="5" height="8" fill="#1a1a2e"/>
  <rect x="20" y="18" width="5" height="8" fill="#1a1a2e"/>
  
  <!-- Back arm (balance) -->
  <rect x="4" y="16" width="6" height="10" fill="#2c3e50"/>
  <rect x="2" y="24" width="6" height="6" fill="#d4a574"/>
  
  <!-- Front arm (knife swing extended) -->
  <rect x="28" y="16" width="8" height="5" fill="#2c3e50"/>
  <rect x="34" y="15" width="6" height="6" fill="#d4a574"/>
  
  <!-- Head -->
  <rect x="12" y="2" width="14" height="14" fill="#d4a574"/>
  
  <!-- Helmet -->
  <rect x="10" y="0" width="18" height="10" fill="#1a252f"/>
  <rect x="10" y="8" width="18" height="2" fill="#0f0f1a"/>
  
  <!-- Visor -->
  <rect x="14" y="6" width="10" height="4" fill="#0f3460"/>
  <rect x="15" y="7" width="3" height="2" fill="#1a5fb4"/>
  <rect x="20" y="7" width="3" height="2" fill="#1a5fb4"/>
  
  <!-- Knife blade (extended) -->
  <rect x="38" y="16" width="8" height="2" fill="#c0c0c0"/>
  <rect x="44" y="15" width="4" height="4" fill="#c0c0c0"/>
  
  <!-- Impact flash -->
  <rect x="46" y="12" width="2" height="3" fill="#ffff00"/>
  <rect x="46" y="18" width="2" height="3" fill="#ffff00"/>
  <rect x="44" y="10" width="2" height="2" fill="#ff8800"/>
  <rect x="44" y="21" width="2" height="2" fill="#ff8800"/>
  
  <!-- Knife handle -->
  <rect x="36" y="17" width="2" height="4" fill="#8b4513"/>
</svg>