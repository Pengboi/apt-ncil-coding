<svg width="32" height="48" viewBox="0 0 32 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Soldier Jumping/Falling -->
  
  <!-- Legs (bent in air) -->
  <rect x="4" y="34" width="10" height="8" fill="#4a4a3a"/>
  <rect x="16" y="30" width="10" height="8" fill="#4a4a3a"/>
  
  <!-- Boots (angled) -->
  <rect x="2" y="40" width="12" height="4" fill="#2a2a1a"/>
  <rect x="18" y="36" width="12" height="4" fill="#2a2a1a"/>
  
  <!-- Body/Torso -->
  <rect x="4" y="14" width="24" height="18" fill="#5d6d3d"/>
  <rect x="6" y="16" width="20" height="12" fill="#4a5a2d"/>
  
  <!-- Tactical vest -->
  <rect x="8" y="18" width="6" height="6" fill="#3a4a1d"/>
  <rect x="18" y="18" width="6" height="6" fill="#3a4a1d"/>
  
  <!-- Arms (raised for balance) -->
  <rect x="0" y="12" width="6" height="12" fill="#5d6d3d"/>
  <rect x="26" y="16" width="6" height="12" fill="#5d6d3d"/>
  
  <!-- Hands -->
  <rect x="0" y="22" width="6" height="5" fill="#d4a574"/>
  <rect x="26" y="26" width="6" height="5" fill="#d4a574"/>
  
  <!-- Head -->
  <rect x="8" y="2" width="16" height="14" fill="#d4a574"/>
  
  <!-- Helmet -->
  <rect x="6" y="0" width="20" height="10" fill="#4a5a2d"/>
  <rect x="6" y="8" width="20" height="2" fill="#3a4a1d"/>
  
  <!-- Goggles -->
  <rect x="10" y="6" width="12" height="4" fill="#1a1a1a"/>
  <rect x="11" y="7" width="4" height="2" fill="#2a3a4a"/>
  <rect x="17" y="7" width="4" height="2" fill="#2a3a4a"/>
  
  <!-- Rifle (aimed up slightly) -->
  <rect x="20" y="18" width="12" height="4" fill="#2a2a2a"/>
  <rect x="28" y="14" width="4" height="6" fill="#2a2a2a"/>
</svg>