<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Soldier Shooting - Tactical Stance (wider for rifle extension) -->
  
  <!-- Back leg (planted back for stability) -->
  <rect x="4" y="34" width="8" height="14" fill="#4a4a3a"/>
  <rect x="2" y="44" width="12" height="4" fill="#2a2a1a"/>
  
  <!-- Front leg (forward for wide stance) -->
  <rect x="20" y="32" width="8" height="16" fill="#4a4a3a"/>
  <rect x="18" y="44" width="12" height="4" fill="#2a2a1a"/>
  
  <!-- Body/Torso (angled slightly forward for recoil absorption) -->
  <rect x="6" y="16" width="22" height="18" fill="#5d6d3d"/>
  <rect x="8" y="18" width="18" height="14" fill="#4a5a2d"/>
  
  <!-- Tactical vest with magazine pouches -->
  <rect x="10" y="20" width="5" height="8" fill="#3a4a1d"/>
  <rect x="19" y="20" width="5" height="8" fill="#3a4a1d"/>
  
  <!-- Back arm (bent, supporting rifle stock) -->
  <rect x="4" y="18" width="6" height="10" fill="#5d6d3d"/>
  <rect x="2" y="24" width="6" height="6" fill="#d4a574"/>
  
  <!-- Front arm (extended, holding foregrip) -->
  <rect x="22" y="20" width="10" height="5" fill="#5d6d3d"/>
  <rect x="30" y="19" width="6" height="6" fill="#d4a574"/>
  
  <!-- Head (tilted slightly to sight) -->
  <rect x="10" y="4" width="14" height="14" fill="#d4a574"/>
  
  <!-- Helmet -->
  <rect x="8" y="2" width="18" height="10" fill="#4a5a2d"/>
  <rect x="8" y="10" width="18" height="2" fill="#3a4a1d"/>
  
  <!-- Tactical goggles (orange lens) -->
  <rect x="12" y="8" width="10" height="4" fill="#1a1a1a"/>
  <rect x="13" y="9" width="3" height="2" fill="#e67e22"/>
  <rect x="18" y="9" width="3" height="2" fill="#e67e22"/>
  
  <!-- Rifle (extended forward, shouldered) -->
  <!-- Stock at shoulder -->
  <rect x="6" y="20" width="4" height="5" fill="#2a2a2a"/>
  <!-- Main body -->
  <rect x="26" y="18" width="20" height="5" fill="#2a2a2a"/>
  <!-- Barrel -->
  <rect x="44" y="19" width="6" height="3" fill="#1a1a1a"/>
  <!-- Magazine -->
  <rect x="32" y="23" width="4" height="6" fill="#1a1a1a"/>
  <!-- Scope/sights -->
  <rect x="34" y="16" width="6" height="2" fill="#1a1a1a"/>
  
  <!-- Muzzle flash - bright yellow burst -->
  <rect x="50" y="17" width="4" height="7" fill="#f39c12"/>
  <rect x="52" y="16" width="3" height="9" fill="#f1c40f"/>
  <rect x="54" y="18" width="2" height="5" fill="#fff"/>
  
  <!-- Sparks/particles -->
  <rect x="55" y="15" width="1" height="2" fill="#f1c40f"/>
  <rect x="56" y="20" width="1" height="1" fill="#f39c12"/>
  <rect x="55" y="24" width="1" height="2" fill="#f1c40f"/>
</svg>