            - heading "Icons and Transformations" [level=3] [ref=e366]
            - paragraph [ref=e367]: "Portals placed throughout the map will change your icon's shape and how it moves:"
            - list [ref=e368]:
              - listitem [ref=e369]: "Cube: The standard mode for jumping over spikes and platforms."
              - listitem [ref=e370]: "Ship: Hold the button to fly upward and release it to descend."
              - listitem [ref=e371]: "Ball: Clicking switches your gravity between the floor and the ceiling."
              - listitem [ref=e372]: "UFO: Tap to perform mid-air jumps, similar to Flappy Bird mechanics."
            - heading "Quick Survival Tips for Beginners" [level=2] [ref=e373]
            - paragraph [ref=e374]: "Geometry Dash online has a great difficulty curve. Use these practical strategies to improve your survival rate:"
            - list [ref=e375]:
              - listitem [ref=e376]: "Listen to the Beat: Most obstacles are placed in sync with the soundtrack. Use the rhythm to time your clicks rather than relying only on your eyes."
              - listitem [ref=e377]: "Use Practice Mode: This mode allows you to drop checkpoints. It is the most effective way to memorize difficult sections and map layouts before attempting a Normal run."
              - listitem [ref=e378]: "Prioritize Survival: Skip the secret coins during your first few attempts. These coins are often placed in traps and can cause unnecessary crashes. Focus on reaching 100% completion first."
