            - paragraph [ref=e333]:
              - text: Geometry Dash is a rhythm-based platformer where you control a square icon through various obstacle courses. Every jump and movement is timed to an electronic soundtrack. You can play Geometry Dash Unblocked and free directly in your browser on
              - link "Ozgames.io" [ref=e334] [cursor=pointer]:
                - /url: https://ozgames.io
              - text: without downloading any files or software.
            - heading "How to Play Geometry Dash" [level=2] [ref=e335]
            - paragraph [ref=e336]: To complete a level, you must reach the finish line without hitting any spikes, saws, or walls. If you crash into an obstacle, your progress resets to the beginning of the stage. Success relies on your ability to match your jumps with the beat of the music. As you progress, the speed increases and the hazards become more complex, requiring better timing and muscle memory.
