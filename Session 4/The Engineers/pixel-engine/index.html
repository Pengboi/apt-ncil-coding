<!DOCTYPE html>
<html>
<head>
<title>Pixel Indie Engine</title>

<style>
body{
margin:0;
background:#111;
overflow:hidden;
}

canvas{
display:block;
margin:auto;
background:#87CEEB;
image-rendering:pixelated;
}
</style>
</head>

<body>

<canvas id="game" width="960" height="540"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let gravity = 0.6
let cameraX = 0

let keys={}
let score=0

document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)


// PLAYER

let player={
x:100,
y:200,
w:32,
h:32,
vx:0,
vy:0,
jump:false,
health:100,
weapon:"sword",
inventory:["sword"]
}


// WORLD

let platforms=[]
let coins=[]
let enemies=[]
let boss=null


// PROCEDURAL LEVEL

function generateWorld(){

for(let i=0;i<50;i++){

let x=i*120

platforms.push({
x:x,
y:350-Math.random()*120,
w:120,
h:20
})

if(Math.random()<0.3){
coins.push({x:x+60,y:250})
}

if(Math.random()<0.15){
enemies.push({
x:x+50,
y:320,
w:30,
h:30,
dir:1,
health:30
})
}

}

boss={
x:5000,
y:300,
w:80,
h:80,
health:200
}

}

generateWorld()



// PLAYER PHYSICS

function playerPhysics(){

player.vy+=gravity

if(keys["ArrowRight"]) player.vx=3
else if(keys["ArrowLeft"]) player.vx=-3
else player.vx=0

if(keys[" "] && !player.jump){
player.vy=-12
player.jump=true
}

player.x+=player.vx
player.y+=player.vy

platforms.forEach(p=>{

if(
player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y<p.y+p.h &&
player.y+player.h>p.y
){
player.y=p.y-player.h
player.vy=0
player.jump=false
}

})

}


// ENEMIES

function updateEnemies(){

enemies.forEach(e=>{

e.x+=e.dir

if(Math.random()<0.01) e.dir*=-1

if(
player.x<e.x+e.w &&
player.x+player.w>e.x &&
player.y<e.y+e.h &&
player.y+player.h>e.y
){

if(player.vy>0){
e.health-=20
player.vy=-8
score+=10
}

else{
player.health-=1
}

}

})

}


// BOSS

function updateBoss(){

if(!boss) return

if(player.x>4800){

if(
player.x<boss.x+boss.w &&
player.x+player.w>boss.x &&
player.y<boss.y+boss.h &&
player.y+player.h>boss.y
){

player.health-=2

}

}

}


// COINS

function updateCoins(){

coins.forEach(c=>{

if(
player.x<c.x+20 &&
player.x+player.w>c.x &&
player.y<c.y+20 &&
player.y+player.h>c.y
){
score+=5
c.x=-100
}

})

}


// INVENTORY

function addItem(item){

player.inventory.push(item)

}


// SAVE SYSTEM

function saveGame(){

let save={
x:player.x,
y:player.y,
score:score,
inventory:player.inventory
}

localStorage.setItem("pixelSave",JSON.stringify(save))

}


function loadGame(){

let data=localStorage.getItem("pixelSave")

if(data){

let save=JSON.parse(data)

player.x=save.x
player.y=save.y
score=save.score
player.inventory=save.inventory

}

}


// CONTROLLER SUPPORT

window.addEventListener("gamepadconnected",e=>{
console.log("Controller connected")
})

function handleGamepad(){

let gp=navigator.getGamepads()[0]

if(!gp) return

if(gp.axes[0]>0.3) player.vx=3
if(gp.axes[0]<-0.3) player.vx=-3

if(gp.buttons[0].pressed && !player.jump){
player.vy=-12
player.jump=true
}

}


// DRAWING

function drawBackground(){

ctx.fillStyle="#6ab04c"
ctx.fillRect(0,300,960,240)

}


function drawPlatforms(){

ctx.fillStyle="#2ecc71"

platforms.forEach(p=>{
ctx.fillRect(p.x-cameraX,p.y,p.w,p.h)
})

}


function drawCoins(){

ctx.fillStyle="gold"

coins.forEach(c=>{
ctx.beginPath()
ctx.arc(c.x-cameraX,c.y,8,0,Math.PI*2)
ctx.fill()
})

}


function drawEnemies(){

ctx.fillStyle="red"

enemies.forEach(e=>{
ctx.fillRect(e.x-cameraX,e.y,e.w,e.h)
})

}


function drawBoss(){

if(!boss) return

ctx.fillStyle="purple"
ctx.fillRect(boss.x-cameraX,boss.y,boss.w,boss.h)

ctx.fillStyle="white"
ctx.fillText("BOSS",boss.x-cameraX,boss.y-10)

}


function drawPlayer(){

ctx.fillStyle="#2b6cff"
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h)

ctx.fillStyle="white"
ctx.fillRect(player.x-cameraX+8,player.y+8,6,6)
ctx.fillRect(player.x-cameraX+18,player.y+8,6,6)

}


function drawUI(){

ctx.fillStyle="black"
ctx.fillRect(0,0,250,60)

ctx.fillStyle="white"
ctx.font="16px Arial"

ctx.fillText("Score: "+score,10,20)
ctx.fillText("HP: "+player.health,10,40)
ctx.fillText("Items: "+player.inventory.length,120,40)

}


// GAME LOOP

function gameLoop(){

ctx.clearRect(0,0,960,540)

handleGamepad()

playerPhysics()
updateEnemies()
updateCoins()
updateBoss()

cameraX=player.x-200

drawBackground()
drawPlatforms()
drawCoins()
drawEnemies()
drawBoss()
drawPlayer()
drawUI()

if(player.health<=0){
alert("Game Over")
location.reload()
}

requestAnimationFrame(gameLoop)

}

loadGame()

gameLoop()


// AUTO SAVE

setInterval(saveGame,5000)

</script>

</body>
</html>
