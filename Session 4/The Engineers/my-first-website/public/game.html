<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Adventure Enhanced</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}

#gameContainer {
  position: relative;
  box-shadow: 0 0 40px rgba(0, 245, 255, 0.3), 0 0 80px rgba(255, 0, 160, 0.2);
  border-radius: 8px;
  overflow: hidden;
}

#game {
  display: block;
  background: #87CEEB;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

#controls {
  margin-top: 20px;
  color: #a0a0b0;
  font-size: 14px;
  text-align: center;
}

#controls span {
  color: #00f5ff;
  margin: 0 8px;
}

.key {
  display: inline-block;
  background: #2a2a3e;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid #3a3a4e;
  color: #fff;
  margin: 0 2px;
}

#startScreen, #gameOverScreen, #pauseScreen {
  position: absolute;
  inset: 0;
  background: rgba(10, 10, 15, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

#startScreen h1 {
  font-size: 48px;
  background: linear-gradient(135deg, #00f5ff, #ff00a0, #ffb800);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
}

#startScreen p {
  color: #a0a0b0;
  margin-bottom: 30px;
}

.btn {
  background: linear-gradient(135deg, #00f5ff, #8b5cf6);
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  color: #0a0a0f;
  cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
}

.hidden {
  display: none !important;
}

.stat-bar {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 32px;
  font-weight: bold;
  color: #00f5ff;
}

.stat-label {
  font-size: 12px;
  color: #606070;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="960" height="540"></canvas>
  <canvas id="ui" width="960" height="540"></canvas>
  
  <!-- Start Screen -->
  <div id="startScreen">
    <h1>PIXEL ADVENTURE</h1>
    <p>Defeat enemies, collect coins, conquer the boss!</p>
    <button class="btn" onclick="startGame()">START ADVENTURE</button>
    <div class="stat-bar">
      <div class="stat-item">
        <div class="stat-value">60</div>
        <div class="stat-label">Platforms</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">10+</div>
        <div class="stat-label">Enemies</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">1</div>
        <div class="stat-label">Boss</div>
      </div>
    </div>
  </div>
  
  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="hidden">
    <h1 id="endTitle" style="font-size: 48px; color: #ff00a0; margin-bottom: 10px;">GAME OVER</h1>
    <p id="endMessage" style="color: #a0a0b0; margin-bottom: 20px;">Your adventure ends here...</p>
    <div class="stat-bar" style="margin-bottom: 30px;">
      <div class="stat-item">
        <div class="stat-value" id="finalScore">0</div>
        <div class="stat-label">Final Score</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="finalCoins">0</div>
        <div class="stat-label">Coins</div>
      </div>
    </div>
    <button class="btn" onclick="restartGame()">TRY AGAIN</button>
  </div>
  
  <!-- Pause Screen -->
  <div id="pauseScreen" class="hidden">
    <h1 style="font-size: 48px; color: #ffb800; margin-bottom: 30px;">PAUSED</h1>
    <button class="btn" onclick="resumeGame()">RESUME</button>
  </div>
</div>

<div id="controls">
  <span class="key">←</span> <span class="key">→</span> Move 
  <span class="key">SPACE</span> / <span class="key">↑</span> Jump
  <span class="key">Z</span> Attack
  <span class="key">P</span> Pause
  <span class="key">R</span> Restart
</div>

<script>
// ============================================
// PIXEL ADVENTURE ENHANCED
// ============================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const uiCanvas = document.getElementById('ui');
const uiCtx = uiCanvas.getContext('2d');

// Disable smoothing for pixel art look
ctx.imageSmoothingEnabled = false;

// Game State
let gameState = 'start'; // start, playing, paused, gameover
let gravity = 0.6;
let cameraX = 0;
let cameraY = 0;
let targetCameraX = 0;
let score = 0;
let coinsCollected = 0;
let gameTime = 0;

// Keys
let keys = {};
let keysPressed = {};

// Particles
let particles = [];

// Floating texts
let floatingTexts = [];

// Screen shake
let shakeAmount = 0;

// Audio context
let audioCtx = null;

// ============================================
// INPUT HANDLING
// ============================================

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  
  // Prevent scrolling with arrow keys and space
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
  
  // Pause toggle
  if(e.key === 'p' || e.key === 'P') {
    if(gameState === 'playing') pauseGame();
    else if(gameState === 'paused') resumeGame();
  }
  
  // Restart
  if(e.key === 'r' || e.key === 'R') {
    restartGame();
  }
  
  // Attack
  if((e.key === 'z' || e.key === 'Z') && gameState === 'playing') {
    playerAttack();
  }
});

document.addEventListener('keyup', e => {
  keys[e.key] = false;
  if(e.key !== ' ') keysPressed[e.key] = false;
});

// ============================================
// PLAYER
// ============================================

let player = {
  x: 100,
  y: 200,
  w: 28,
  h: 36,
  vx: 0,
  vy: 0,
  speed: 4.5,
  jumpPower: -12,
  grounded: false,
  facingRight: true,
  animFrame: 0,
  animTimer: 0,
  health: 100,
  maxHealth: 100,
  inventory: ['sword'],
  weapon: 'sword',
  attacking: false,
  attackTimer: 0,
  attackCooldown: 0,
  invulnerable: 0,
  coyoteTime: 0,
  jumpBuffer: 0
};

// ============================================
// WORLD DATA
// ============================================

let platforms = [];
let coins = [];
let enemies = [];
let boss = null;
let clouds = [];
let decorations = [];

// ============================================
// WORLD GENERATION
// ============================================

function generateWorld() {
  platforms = [];
  coins = [];
  enemies = [];
  clouds = [];
  decorations = [];
  
  // Starting platform
  platforms.push({ x: 50, y: 350, w: 200, h: 20 });
  
  // Generate world
  let currentX = 250;
  for(let i = 0; i < 50; i++) {
    let gap = 60 + Math.random() * 80;
    let width = 80 + Math.random() * 100;
    let yVariation = (Math.random() - 0.5) * 150;
    let y = Math.max(200, Math.min(420, 350 + yVariation));
    
    platforms.push({
      x: currentX + gap,
      y: y,
      w: width,
      h: 20
    });
    
    // Add coins
    if(Math.random() < 0.5) {
      let coinCount = 1 + Math.floor(Math.random() * 3);
      for(let c = 0; c < coinCount; c++) {
        coins.push({
          x: currentX + gap + 20 + c * 25,
          y: y - 40 - Math.random() * 30,
          collected: false,
          floatOffset: Math.random() * Math.PI * 2
        });
      }
    }
    
    // Add enemies
    if(Math.random() < 0.25 && i > 2) {
      enemies.push(createEnemy(currentX + gap + width/2, y - 28));
    }
    
    // Add decorations (grass, flowers)
    if(Math.random() < 0.3) {
      decorations.push({
        x: currentX + gap + Math.random() * width,
        y: y,
        type: Math.random() < 0.5 ? 'grass' : 'flower'
      });
    }
    
    currentX += gap + width;
  }
  
  // Boss platform
  let bossX = currentX + 200;
  platforms.push({ x: bossX, y: 350, w: 600, h: 20 });
  
  // Create boss
  boss = {
    x: bossX + 400,
    y: 270,
    w: 70,
    h: 80,
    health: 300,
    maxHealth: 300,
    phase: 0,
    attackTimer: 0,
    moveTimer: 0,
    dir: -1,
    active: false,
    animFrame: 0
  };
  
  // Generate clouds
  for(let i = 0; i < 20; i++) {
    clouds.push({
      x: Math.random() * 8000,
      y: 50 + Math.random() * 150,
      w: 60 + Math.random() * 80,
      speed: 0.2 + Math.random() * 0.3
    });
  }
}

function createEnemy(x, y) {
  return {
    x: x,
    y: y,
    w: 26,
    h: 26,
    vx: 0,
    vy: 0,
    dir: Math.random() < 0.5 ? 1 : -1,
    health: 40,
    maxHealth: 40,
    grounded: false,
    animFrame: 0,
    patrolStart: x - 60,
    patrolEnd: x + 60,
    state: 'patrol' // patrol, chase, hurt
  };
}

// ============================================
// PHYSICS & UPDATES
// ============================================

function updatePlayer() {
  // Coyote time (allow jump briefly after leaving platform)
  if(player.grounded) {
    player.coyoteTime = 6;
  } else {
    player.coyoteTime--;
  }
  
  // Jump buffer
  if(keys[' '] || keys['ArrowUp']) {
    if(!keysPressed['jump']) {
      player.jumpBuffer = 6;
      keysPressed['jump'] = true;
    }
  } else {
    keysPressed['jump'] = false;
  }
  
  // Jump
  if(player.jumpBuffer > 0 && player.coyoteTime > 0) {
    player.vy = player.jumpPower;
    player.grounded = false;
    player.coyoteTime = 0;
    player.jumpBuffer = 0;
    player.animFrame = 0;
    createDust(player.x + player.w/2, player.y + player.h, 5);
    playSound('jump');
  }
  
  player.jumpBuffer--;
  
  // Variable jump height
  if((!keys[' '] && !keys['ArrowUp']) && player.vy < -6) {
    player.vy *= 0.7;
  }
  
  // Horizontal movement
  if(keys['ArrowRight']) {
    player.vx += 0.8;
    player.facingRight = true;
  } else if(keys['ArrowLeft']) {
    player.vx -= 0.8;
    player.facingRight = false;
  } else {
    player.vx *= 0.8;
  }
  
  // Clamp speed
  player.vx = Math.max(-player.speed, Math.min(player.speed, player.vx));
  
  // Apply gravity
  player.vy += gravity;
  player.vy = Math.min(player.vy, 12); // Terminal velocity
  
  // Update position
  player.x += player.vx;
  player.y += player.vy;
  
  // Platform collisions
  player.grounded = false;
  for(let p of platforms) {
    if(checkCollision(player, p)) {
      // Landing on top
      if(player.vy > 0 && player.y < p.y) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
      // Hitting head
      else if(player.vy < 0 && player.y > p.y) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
      // Side collisions
      else if(player.vx > 0) {
        player.x = p.x - player.w;
        player.vx = 0;
      }
      else if(player.vx < 0) {
        player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }
  
  // Fall off world
  if(player.y > 600) {
    player.health = 0;
  }
  
  // Animation
  if(Math.abs(player.vx) > 0.5) {
    player.animTimer++;
    if(player.animTimer > 6) {
      player.animFrame = (player.animFrame + 1) % 4;
      player.animTimer = 0;
    }
  } else {
    player.animFrame = 0;
  }
  
  // Attack
  if(player.attacking) {
    player.attackTimer--;
    if(player.attackTimer <= 0) {
      player.attacking = false;
    }
  }
  if(player.attackCooldown > 0) {
    player.attackCooldown--;
  }
  
  // Invulnerability
  if(player.invulnerable > 0) {
    player.invulnerable--;
  }
}

function playerAttack() {
  if(player.attackCooldown > 0 || player.attacking) return;
  
  player.attacking = true;
  player.attackTimer = 15;
  player.attackCooldown = 30;
  
  playSound('swing');
  
  // Attack hitbox
  let attackBox = {
    x: player.facingRight ? player.x + player.w : player.x - 40,
    y: player.y + 5,
    w: 45,
    h: 25
  };
  
  // Check enemy hits
  for(let e of enemies) {
    if(checkCollision(attackBox, e)) {
      e.health -= 20;
      e.state = 'hurt';
      e.vx = player.facingRight ? 5 : -5;
      e.vy = -3;
      score += 15;
      shakeAmount = 5;
      createParticles(e.x + e.w/2, e.y + e.h/2, 8, '#ff4444');
      addFloatingText(e.x, e.y, '-20', '#ff4444');
      playSound('hit');
      
      if(e.health <= 0) {
        createParticles(e.x + e.w/2, e.y + e.h/2, 15, '#ff8800');
        score += 50;
        addFloatingText(e.x, e.y - 20, '+50', '#ffb800');
        playSound('kill');
      }
    }
  }
  
  // Check boss hit
  if(boss && boss.active && checkCollision(attackBox, boss)) {
    boss.health -= 10;
    shakeAmount = 8;
    createParticles(boss.x + boss.w/2, boss.y + boss.h/2, 10, '#aa44ff');
    addFloatingText(boss.x + 20, boss.y, '-10', '#aa44ff');
    playSound('hitBoss');
    
    if(boss.health <= 0) {
      createParticles(boss.x + boss.w/2, boss.y + boss.h/2, 50, '#ff00a0');
      score += 1000;
      addFloatingText(boss.x, boss.y - 40, 'VICTORY!', '#00f5ff');
      playSound('win');
      setTimeout(() => gameOver(true), 2000);
    }
  }
}

function updateEnemies() {
  for(let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    
    // Remove dead enemies
    if(e.health <= 0) {
      enemies.splice(i, 1);
      continue;
    }
    
    // Physics
    e.vy += gravity;
    e.grounded = false;
    
    // Platform collisions
    for(let p of platforms) {
      if(checkCollision(e, p)) {
        if(e.vy > 0 && e.y < p.y) {
          e.y = p.y - e.h;
          e.vy = 0;
          e.grounded = true;
        }
      }
    }
    
    // AI
    let distToPlayer = Math.abs(player.x - e.x);
    
    if(e.state === 'hurt') {
      e.x += e.vx;
      e.y += e.vy;
      if(e.grounded) {
        e.state = 'patrol';
        e.vx = 0;
      }
    } else if(distToPlayer < 200 && player.y > e.y - 100 && player.y < e.y + 100) {
      // Chase
      e.state = 'chase';
      e.dir = player.x > e.x ? 1 : -1;
      e.x += e.dir * 2;
    } else {
      // Patrol
      e.state = 'patrol';
      e.x += e.dir;
      if(e.x < e.patrolStart || e.x > e.patrolEnd) {
        e.dir *= -1;
      }
    }
    
    // Player collision
    if(checkCollision(player, e) && player.invulnerable <= 0) {
      // Stomp from above
      if(player.vy > 0 && player.y < e.y) {
        e.health -= 20;
        player.vy = -8;
        score += 10;
        createParticles(e.x + e.w/2, e.y, 5, '#ffff00');
        playSound('stomp');
      } else {
        // Take damage
        player.health -= 15;
        player.invulnerable = 60;
        player.vx = player.x < e.x ? -6 : 6;
        player.vy = -5;
        shakeAmount = 8;
        playSound('hurt');
        createParticles(player.x + player.w/2, player.y + player.h/2, 8, '#ff0000');
      }
    }
    
    e.y += e.vy;
    e.animFrame++;
  }
}

function updateBoss() {
  if(!boss) return;
  
  let distToPlayer = Math.abs(player.x - boss.x);
  
  // Activate when player is near
  if(!boss.active && distToPlayer < 500) {
    boss.active = true;
    addFloatingText(boss.x, boss.y - 50, 'BOSS APPEARS!', '#ff00a0');
    playSound('bossAppear');
  }
  
  if(!boss.active) return;
  
  boss.animFrame++;
  boss.attackTimer++;
  
  // Boss AI
  if(boss.attackTimer > 120) {
    // Attack phase
    boss.phase = 1;
    if(boss.attackTimer > 150) {
      boss.attackTimer = 0;
      boss.phase = 0;
    }
  } else {
    // Movement
    boss.moveTimer++;
    if(boss.moveTimer > 60) {
      boss.dir = player.x > boss.x ? 1 : -1;
      boss.moveTimer = 0;
    }
    boss.x += boss.dir * 1.5;
    boss.x = Math.max(boss.x, boss.x - 100); // Stay on platform
  }
  
  // Player collision
  if(checkCollision(player, boss) && player.invulnerable <= 0) {
    player.health -= 25;
    player.invulnerable = 90;
    player.vx = player.x < boss.x ? -10 : 10;
    player.vy = -7;
    shakeAmount = 12;
    playSound('hurt');
    createParticles(player.x + player.w/2, player.y + player.h/2, 12, '#ff0000');
  }
}

function updateCoins() {
  for(let c of coins) {
    if(c.collected) continue;
    
    // Float animation
    c.floatOffset += 0.1;
    
    // Collection
    let coinBox = { x: c.x - 8, y: c.y - 8 - Math.sin(c.floatOffset) * 5, w: 16, h: 16 };
    if(checkCollision(player, coinBox)) {
      c.collected = true;
      score += 10;
      coinsCollected++;
      createParticles(c.x, c.y, 6, '#ffd700');
      addFloatingText(c.x, c.y - 20, '+10', '#ffd700');
      playSound('coin');
    }
  }
}

function updateParticles() {
  for(let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    p.size *= 0.95;
    
    if(p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function updateFloatingTexts() {
  for(let i = floatingTexts.length - 1; i >= 0; i--) {
    let t = floatingTexts[i];
    t.y -= 1;
    t.life--;
    t.alpha = t.life / 40;
    
    if(t.life <= 0) {
      floatingTexts.splice(i, 1);
    }
  }
}

function updateClouds() {
  for(let c of clouds) {
    c.x -= c.speed;
    if(c.x + c.w < cameraX - 100) {
      c.x = cameraX + 1060;
    }
  }
}

function updateCamera() {
  // Smooth camera follow
  targetCameraX = player.x - 200;
  targetCameraX = Math.max(0, targetCameraX);
  
  cameraX += (targetCameraX - cameraX) * 0.1;
  
  // Screen shake
  if(shakeAmount > 0) {
    cameraX += (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.9;
    if(shakeAmount < 0.5) shakeAmount = 0;
  }
}

// ============================================
// DRAWING
// ============================================

function drawBackground() {
  // Sky gradient
  let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#87CEEB');
  gradient.addColorStop(0.5, '#B0E0E6');
  gradient.addColorStop(1, '#E0F6FF');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw clouds (parallax)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  for(let c of clouds) {
    let parallaxX = (c.x - cameraX * 0.3) % 9000;
    if(parallaxX < -200) parallaxX += 9000;
    
    drawCloud(parallaxX, c.y, c.w);
  }
  
  // Distant mountains
  ctx.fillStyle = '#6B8E6B';
  for(let i = 0; i < 20; i++) {
    let mx = (i * 300 - cameraX * 0.2) % 6000;
    if(mx < -400) mx += 6000;
    drawMountain(mx, 350, 200 + (i % 3) * 50);
  }
  
  // Ground
  ctx.fillStyle = '#4a7c4e';
  ctx.fillRect(0, 420, canvas.width, 120);
  
  // Grass details
  ctx.fillStyle = '#5a8c5e';
  for(let i = 0; i < canvas.width; i += 40) {
    let gx = (i - cameraX * 0.5) % 2000;
    if(gx < 0) gx += 2000;
    ctx.fillRect(gx, 420, 20, 5);
  }
}

function drawCloud(x, y, w) {
  ctx.beginPath();
  ctx.arc(x + w * 0.2, y, w * 0.2, 0, Math.PI * 2);
  ctx.arc(x + w * 0.5, y - w * 0.1, w * 0.25, 0, Math.PI * 2);
  ctx.arc(x + w * 0.8, y, w * 0.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawMountain(x, y, h) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 100, y - h);
  ctx.lineTo(x + 200, y);
  ctx.fill();
}

function drawPlatforms() {
  for(let p of platforms) {
    if(p.x - cameraX > canvas.width || p.x + p.w - cameraX < 0) continue;
    
    // Platform body
    ctx.fillStyle = '#2d5016';
    ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
    
    // Grass top
    ctx.fillStyle = '#4a7c23';
    ctx.fillRect(p.x - cameraX, p.y, p.w, 6);
    
    // Highlight
    ctx.fillStyle = '#6ab04c';
    ctx.fillRect(p.x - cameraX, p.y, p.w, 2);
    
    // Shadow
    ctx.fillStyle = '#1a3009';
    ctx.fillRect(p.x - cameraX, p.y + p.h - 4, p.w, 4);
  }
}

function drawDecorations() {
  for(let d of decorations) {
    if(d.x - cameraX > canvas.width || d.x - cameraX < -50) continue;
    
    if(d.type === 'grass') {
      ctx.fillStyle = '#4a7c23';
      ctx.fillRect(d.x - cameraX, d.y - 8, 3, 8);
      ctx.fillRect(d.x - cameraX + 6, d.y - 12, 3, 12);
      ctx.fillRect(d.x - cameraX + 12, d.y - 6, 3, 6);
    } else {
      // Flower
      ctx.fillStyle = '#ff6b9d';
      ctx.fillRect(d.x - cameraX - 3, d.y - 10, 6, 6);
      ctx.fillStyle = '#ffd93d';
      ctx.fillRect(d.x - cameraX - 2, d.y - 9, 4, 4);
      ctx.fillStyle = '#4a7c23';
      ctx.fillRect(d.x - cameraX, d.y - 4, 2, 4);
    }
  }
}

function drawCoins() {
  for(let c of coins) {
    if(c.collected) continue;
    if(c.x - cameraX > canvas.width || c.x - cameraX < -50) continue;
    
    let floatY = Math.sin(c.floatOffset) * 5;
    let cx = c.x - cameraX;
    let cy = c.y + floatY;
    
    // Glow
    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.fill();
    
    // Coin
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner
    ctx.fillStyle = '#FFA500';
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fill();
    
    // Shine
    ctx.fillStyle = '#FFFFAA';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEnemies() {
  for(let e of enemies) {
    if(e.x - cameraX > canvas.width || e.x + e.w - cameraX < 0) continue;
    
    let x = e.x - cameraX;
    let y = e.y;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x + e.w/2, y + e.h, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Body (slime-like)
    let squash = Math.abs(Math.sin(e.animFrame * 0.1)) * 3;
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(x + 2, y + squash, e.w - 4, e.h - squash);
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 5, y + 8 + squash, 6, 6);
    ctx.fillRect(x + 15, y + 8 + squash, 6, 6);
    
    ctx.fillStyle = '#000';
    let eyeDir = e.dir > 0 ? 2 : 0;
    ctx.fillRect(x + 7 + eyeDir, y + 10 + squash, 2, 2);
    ctx.fillRect(x + 17 + eyeDir, y + 10 + squash, 2, 2);
    
    // Health bar
    if(e.health < e.maxHealth) {
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y - 10, e.w, 4);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(x, y - 10, e.w * (e.health / e.maxHealth), 4);
    }
  }
}

function drawBoss() {
  if(!boss) return;
  if(boss.x - cameraX > canvas.width || boss.x + boss.w - cameraX < 0) return;
  
  let x = boss.x - cameraX;
  let y = boss.y;
  
  // Boss bar at top of screen when active
  if(boss.active && boss.health > 0) {
    uiCtx.fillStyle = 'rgba(0,0,0,0.5)';
    uiCtx.fillRect(canvas.width/2 - 150, 20, 300, 30);
    uiCtx.fillStyle = '#ff00a0';
    uiCtx.fillRect(canvas.width/2 - 146, 24, 292 * (boss.health / boss.maxHealth), 22);
    uiCtx.fillStyle = '#fff';
    uiCtx.font = 'bold 14px Courier New';
    uiCtx.textAlign = 'center';
    uiCtx.fillText('DARK LORD', canvas.width/2, 42);
  }
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x + boss.w/2, y + boss.h, 30, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Body
  let pulse = Math.sin(gameTime * 0.05) * 5;
  ctx.fillStyle = '#8e44ad';
  ctx.fillRect(x, y - pulse, boss.w, boss.h + pulse);
  
  // Spikes
  ctx.fillStyle = '#6c3483';
  for(let i = 0; i < 5; i++) {
    let sx = x + i * (boss.w/4);
    let sy = y - pulse - 10 - Math.sin(gameTime * 0.1 + i) * 5;
    ctx.beginPath();
    ctx.moveTo(sx, y - pulse);
    ctx.lineTo(sx + 10, sy);
    ctx.lineTo(sx + 20, y - pulse);
    ctx.fill();
  }
  
  // Eyes (glowing)
  ctx.fillStyle = '#ff00a0';
  ctx.shadowColor = '#ff00a0';
  ctx.shadowBlur = 20;
  ctx.fillRect(x + 15, y + 20 - pulse, 15, 15);
  ctx.fillRect(x + 40, y + 20 - pulse, 15, 15);
  ctx.shadowBlur = 0;
  
  // Pupils
  ctx.fillStyle = '#000';
  let lookDir = player.x > boss.x ? 5 : 0;
  ctx.fillRect(x + 20 + lookDir, y + 25 - pulse, 5, 5);
  ctx.fillRect(x + 45 + lookDir, y + 25 - pulse, 5, 5);
  
  // Mouth
  if(boss.phase === 1) {
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(x + 20, y + 50 - pulse, 30, 15);
  }
}

function drawPlayer() {
  if(player.invulnerable > 0 && Math.floor(player.invulnerable / 4) % 2 === 0) return;
  
  let x = player.x - cameraX;
  let y = player.y;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(x + player.w/2, y + player.h, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Determine animation frame
  let frame = 0;
  if(!player.grounded) {
    frame = 3; // Jump
  } else if(Math.abs(player.vx) > 0.5) {
    frame = player.animFrame; // Run
  }
  
  // Body bounce
  let bounce = (frame % 2 === 1 && player.grounded) ? 2 : 0;
  
  // Body
  ctx.fillStyle = '#3498db';
  ctx.fillRect(x + 2, y + bounce, player.w - 4, player.h - 6 - bounce);
  
  // Head
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(x + 4, y - 4 + bounce, player.w - 8, 12);
  
  // Eyes
  ctx.fillStyle = '#fff';
  if(player.facingRight) {
    ctx.fillRect(x + 16, y + 2 + bounce, 5, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 19, y + 3 + bounce, 2, 2);
  } else {
    ctx.fillRect(x + 7, y + 2 + bounce, 5, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 8, y + 3 + bounce, 2, 2);
  }
  
  // Sword
  if(player.attacking) {
    ctx.save();
    ctx.translate(x + player.w/2, y + player.h/2);
    ctx.rotate(player.facingRight ? -0.5 : 0.5);
    
    // Sword blade
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(-2, -30, 4, 25);
    
    // Sword handle
    ctx.fillStyle = '#8e44ad';
    ctx.fillRect(-3, -5, 6, 10);
    
    // Sword glow
    ctx.strokeStyle = 'rgba(0, 245, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -30);
    ctx.lineTo(-2, -5);
    ctx.stroke();
    
    ctx.restore();
  } else {
    // Sheathed sword
    ctx.fillStyle = '#95a5a6';
    if(player.facingRight) {
      ctx.fillRect(x + player.w - 3, y + 15, 3, 12);
    } else {
      ctx.fillRect(x, y + 15, 3, 12);
    }
  }
  
  // Scarf/Cape
  ctx.fillStyle = '#e74c3c';
  let capeWave = Math.sin(gameTime * 0.2) * 3;
  if(player.facingRight) {
    ctx.fillRect(x - 5, y + 10 + bounce, 5, 15);
    ctx.fillRect(x - 8 + capeWave, y + 12 + bounce, 5, 10);
  } else {
    ctx.fillRect(x + player.w, y + 10 + bounce, 5, 15);
    ctx.fillRect(x + player.w + 3 + capeWave, y + 12 + bounce, 5, 10);
  }
}

function drawParticles() {
  for(let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

function drawFloatingTexts() {
  for(let t of floatingTexts) {
    uiCtx.fillStyle = t.color;
    uiCtx.globalAlpha = t.alpha;
    uiCtx.font = 'bold 16px Courier New';
    uiCtx.textAlign = 'center';
    uiCtx.fillText(t.text, t.x - cameraX, t.y);
    uiCtx.globalAlpha = 1;
  }
}

function drawUI() {
  // Clear UI canvas
  uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
  
  // Health bar background
  uiCtx.fillStyle = 'rgba(0,0,0,0.5)';
  uiCtx.fillRect(20, 20, 200, 24);
  
  // Health bar fill
  let healthPercent = player.health / player.maxHealth;
  let healthColor = healthPercent > 0.5 ? '#2ecc71' : healthPercent > 0.25 ? '#f39c12' : '#e74c3c';
  uiCtx.fillStyle = healthColor;
  uiCtx.fillRect(24, 24, 192 * healthPercent, 16);
  
  // Health text
  uiCtx.fillStyle = '#fff';
  uiCtx.font = '12px Courier New';
  uiCtx.textAlign = 'left';
  uiCtx.fillText(`HP: ${player.health}/${player.maxHealth}`, 30, 37);
  
  // Score
  uiCtx.fillStyle = '#fff';
  uiCtx.font = 'bold 20px Courier New';
  uiCtx.textAlign = 'right';
  uiCtx.fillText(`SCORE: ${score}`, uiCanvas.width - 20, 40);
  
  // Coins
  uiCtx.fillStyle = '#ffd700';
  uiCtx.beginPath();
  uiCtx.arc(uiCanvas.width - 100, 70, 10, 0, Math.PI * 2);
  uiCtx.fill();
  uiCtx.fillStyle = '#fff';
  uiCtx.font = '16px Courier New';
  uiCtx.textAlign = 'left';
  uiCtx.fillText(`x ${coinsCollected}`, uiCanvas.width - 85, 75);
  
  // Controls hint (fades out)
  if(gameTime < 300) {
    uiCtx.fillStyle = `rgba(255,255,255,${1 - gameTime/300})`;
    uiCtx.font = '14px Courier New';
    uiCtx.textAlign = 'center';
    uiCtx.fillText('← → to move | SPACE to jump | Z to attack', uiCanvas.width/2, uiCanvas.height - 30);
  }
  
  // Floating texts
  drawFloatingTexts();
}

// ============================================
// UTILITIES
// ============================================

function checkCollision(a, b) {
  return a.x < b.x + b.w &&
         a.x + (a.w || 20) > b.x &&
         a.y < b.y + b.h &&
         a.y + (a.h || 20) > b.y;
}

function createParticles(x, y, count, color) {
  for(let i = 0; i < count; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 30 + Math.random() * 20,
      size: 3 + Math.random() * 4,
      color: color
    });
  }
}

function createDust(x, y, count) {
  for(let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y,
      vx: (Math.random() - 0.5) * 2,
      vy: -Math.random() * 2,
      life: 20,
      size: 2 + Math.random() * 3,
      color: 'rgba(200,200,200,0.5)'
    });
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({
    x: x,
    y: y,
    text: text,
    color: color,
    life: 40,
    alpha: 1
  });
}

// ============================================
// AUDIO
// ============================================

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if(!audioCtx) return;
  
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  let now = audioCtx.currentTime;
  
  switch(type) {
    case 'jump':
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
      
    case 'coin':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.setValueAtTime(1600, now + 0.05);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
      break;
      
    case 'swing':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
      
    case 'hit':
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
      break;
      
    case 'kill':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
      break;
      
    case 'hitBoss':
      osc.type = 'square';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
      break;
      
    case 'hurt':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
      break;
      
    case 'stomp':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
      
    case 'bossAppear':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(50, now);
      for(let i = 0; i < 10; i++) {
        osc.frequency.setValueAtTime(50 + i * 20, now + i * 0.1);
      }
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
      osc.start(now);
      osc.stop(now + 1);
      break;
      
    case 'win':
      osc.type = 'sine';
      let notes = [440, 554, 659, 880];
      notes.forEach((note, i) => {
        let o = audioCtx.createOscillator();
        let g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = note;
        g.gain.setValueAtTime(0.2, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.3);
      });
      break;
  }
}

// ============================================
// GAME FLOW
// ============================================

function startGame() {
  initAudio();
  document.getElementById('startScreen').classList.add('hidden');
  gameState = 'playing';
  resetGame();
}

function resetGame() {
  player = {
    x: 100,
    y: 200,
    w: 28,
    h: 36,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -12,
    grounded: false,
    facingRight: true,
    animFrame: 0,
    animTimer: 0,
    health: 100,
    maxHealth: 100,
    inventory: ['sword'],
    weapon: 'sword',
    attacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    invulnerable: 0,
    coyoteTime: 0,
    jumpBuffer: 0
  };
  
  score = 0;
  coinsCollected = 0;
  gameTime = 0;
  cameraX = 0;
  cameraY = 0;
  targetCameraX = 0;
  particles = [];
  floatingTexts = [];
  
  generateWorld();
}

function pauseGame() {
  gameState = 'paused';
  document.getElementById('pauseScreen').classList.remove('hidden');
}

function resumeGame() {
  gameState = 'playing';
  document.getElementById('pauseScreen').classList.add('hidden');
}

function gameOver(victory = false) {
  gameState = 'gameover';
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('endTitle').textContent = victory ? 'VICTORY!' : 'GAME OVER';
  document.getElementById('endTitle').style.color = victory ? '#00f5ff' : '#ff00a0';
  document.getElementById('endMessage').textContent = victory ? 'You defeated the Dark Lord!' : 'Your adventure ends here...';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalCoins').textContent = coinsCollected;
}

function restartGame() {
  document.getElementById('gameOverScreen').classList.add('hidden');
  gameState = 'playing';
  resetGame();
}

// ============================================
// MAIN LOOP
// ============================================

function gameLoop() {
  if(gameState === 'playing') {
    gameTime++;
    
    updatePlayer();
    updateEnemies();
    updateCoins();
    updateBoss();
    updateParticles();
    updateFloatingTexts();
    updateClouds();
    updateCamera();
    
    // Check game over
    if(player.health <= 0) {
      gameOver(false);
    }
  }
  
  // Always draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  drawBackground();
  drawDecorations();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawBoss();
  drawPlayer();
  drawParticles();
  
  drawUI();
  
  requestAnimationFrame(gameLoop);
}

// Start loop
gameLoop();
</script>
