<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy RPG World</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#081018;
    font-family:'Press Start 2P', cursive;
}

/* WORLD */

.world{
    position:relative;
    width:100vw;
    height:100vh;
    background:
    radial-gradient(circle at center, rgba(120,255,180,0.08), transparent 40%),
    linear-gradient(to bottom, #0b1f1d, #10291f, #061218);
    overflow:hidden;
}

/* FOG */

.fog{
    position:absolute;
    width:200%;
    height:200%;
    background:url("https://www.transparenttextures.com/patterns/foggy-birds.png");
    opacity:0.08;
    animation:fogMove 60s linear infinite;
}

@keyframes fogMove{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-500px);
    }
}

/* TREES */

.tree{
    position:absolute;
    width:90px;
    height:120px;
    background:linear-gradient(to bottom,#1d5c38,#0e2e1b);
    clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
    filter:drop-shadow(0 0 10px rgba(0,255,120,0.3));
    animation:treeFloat 4s ease-in-out infinite;
}

@keyframes treeFloat{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-4px);}
    100%{transform:translateY(0px);}
}

/* LANTERNS */

.lantern{
    position:absolute;
    width:18px;
    height:18px;
    background:#ffd36b;
    border-radius:50%;
    box-shadow:
    0 0 10px #ffd36b,
    0 0 30px #ffb347,
    0 0 60px rgba(255,200,100,0.7);
    animation:flicker 2s infinite alternate;
}

@keyframes flicker{
    from{
        opacity:0.8;
    }
    to{
        opacity:1;
    }
}

/* PLAYER */

.player{
    position:absolute;
    width:48px;
    height:48px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    border-radius:8px;
    box-shadow:
    0 0 20px rgba(255,255,255,0.7),
    0 0 50px rgba(100,255,255,0.3);
    z-index:10;
    animation:playerGlow 2s infinite alternate;
}

@keyframes playerGlow{
    from{
        box-shadow:
        0 0 20px rgba(255,255,255,0.5),
        0 0 40px rgba(100,255,255,0.2);
    }
    to{
        box-shadow:
        0 0 30px rgba(255,255,255,0.9),
        0 0 70px rgba(100,255,255,0.5);
    }
}

/* UI */

.ui{
    position:absolute;
    top:20px;
    left:20px;
    z-index:20;
    color:white;
}

.logo{
    font-size:22px;
    margin-bottom:20px;
    color:#8df9ff;
    text-shadow:0 0 15px #00e1ff;
}

.menu{
    display:flex;
    gap:15px;
}

.menu button{
    padding:14px 22px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    cursor:pointer;
    border-radius:10px;
    backdrop-filter:blur(10px);
    transition:0.3s;
    font-family:'Press Start 2P', cursive;
}

.menu button:hover{
    transform:translateY(-4px) scale(1.05);
    background:#00c3ff;
    box-shadow:0 0 20px #00c3ff;
}

/* PARTICLES */

.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:#9effb3;
    border-radius:50%;
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="world">

    <div class="fog"></div>

    <!-- TREES -->
    <div class="tree" style="left:10%; top:55%;"></div>
    <div class="tree" style="left:25%; top:65%;"></div>
    <div class="tree" style="left:70%; top:50%;"></div>
    <div class="tree" style="left:85%; top:70%;"></div>

    <!-- LANTERNS -->
    <div class="lantern" style="left:30%; top:45%;"></div>
    <div class="lantern" style="left:60%; top:40%;"></div>
    <div class="lantern" style="left:75%; top:60%;"></div>

    <!-- PLAYER -->
    <div class="player"></div>

    <!-- UI -->
    <div class="ui">
        <div class="logo">FANTASY RPG</div>

        <div class="menu">
            <button>START</button>
            <button>LORE</button>
            <button>MAP</button>
        </div>
    </div>

</div>

<script>

/* PARTICLES */

for(let i=0;i<80;i++){

    const particle=document.createElement("div");
    particle.classList.add("particle");

    particle.style.left=Math.random()*100+"vw";
    particle.style.animationDuration=
    (5 + Math.random()*10)+"s";

    particle.style.animationDelay=
    Math.random()*5+"s";

    document.querySelector(".world")
    .appendChild(particle);
}

</script>

</body>
</html>
