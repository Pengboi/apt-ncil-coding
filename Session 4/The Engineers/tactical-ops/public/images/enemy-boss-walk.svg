<svg width="80" height="100" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Boss Walking (Heavy Mechanical Stride) -->
  
  <!-- Back leg (extended) -->
  <rect x="10" y="66" width="14" height="22" fill="#1a0505"/>
  <rect x="8" y="86" width="18" height="8" fill="#0a0202"/>
  
  <!-- Front leg (forward) -->
  <rect x="52" y="60" width="14" height="28" fill="#1a0505"/>
  <rect x="50" y="86" width="18" height="8" fill="#0a0202"/>
  
  <!-- Body -->
  <rect x="8" y="26" width="64" height="42" fill="#2c0a0a"/>
  <rect x="12" y="30" width="56" height="34" fill="#3d0e0e"/>
  <rect x="16" y="34" width="48" height="22" fill="#5c1919"/>
  
  <!-- Core -->
  <rect x="28" y="38" width="24" height="14" fill="#ff3232"/>
  <rect x="30" y="40" width="20" height="10" fill="#ff5555"/>
  
  <!-- Armor -->
  <rect x="18" y="36" width="10" height="10" fill="#1a0505"/>
  <rect x="52" y="36" width="10" height="10" fill="#1a0505"/>
  
  <!-- Head -->
  <rect x="18" y="4" width="44" height="24" fill="#1a0505"/>
  <rect x="20" y="6" width="40" height="16" fill="#3d0e0e"/>
  <rect x="22" y="8" width="36" height="8" fill="#5c1919"/>
  
  <!-- Face -->
  <rect x="24" y="10" width="32" height="10" fill="#b0855a"/>
  
  <!-- Eyes -->
  <rect x="24" y="10" width="10" height="4" fill="#ff0000"/>
  <rect x="46" y="10" width="10" height="4" fill="#ff0000"/>
  
  <!-- Helmet crest -->
  <rect x="28" y="2" width="24" height="4" fill="#5c1919"/>
  
  <!-- Shoulder cannons (swaying) -->
  <rect x="0" y="28" width="12" height="18" fill="#2a0808"/>
  <rect x="2" y="30" width="10" height="10" fill="#3d0e0e"/>
  <rect x="68" y="32" width="12" height="18" fill="#2a0808"/>
  <rect x="68" y="34" width="10" height="10" fill="#3d0e0e"/>
  
  <!-- Cannon barrels -->
  <rect x="0" y="32" width="4" height="4" fill="#1a0505"/>
  <rect x="76" y="36" width="4" height="4" fill="#1a0505"/>
