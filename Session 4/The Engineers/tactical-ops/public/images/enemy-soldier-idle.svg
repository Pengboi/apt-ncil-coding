  <rect x="11" y="9" width="4" height="2" fill="#e67e22"/>
  <rect x="17" y="9" width="4" height="2" fill="#e67e22"/>
  
  <!-- Rifle held ready -->
  <rect x="20" y="24" width="12" height="4" fill="#c4956a"/>
